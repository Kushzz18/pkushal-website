<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Server-side tracking data flow: browser to a first-party Stape server container, forwarding to GA4 and Meta with shared event_id deduplication.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5cc8ff"/>
    </marker>
    <style>
      .bg{fill:#0b1017}
      .box{fill:#121a23;stroke:#2d3f4f;stroke-width:1.5}
      .boxc{fill:#0f2130;stroke:#2a6f96;stroke-width:2}
      .t{font-family:'IBM Plex Mono',monospace;fill:#e6edf3}
      .a{fill:#5cc8ff}.g{fill:#7ee787}.m{fill:#8b98a5}
      .ln{stroke:#5cc8ff;stroke-width:1.6;fill:none}
      .chip{fill:#0b1017}
      .lbl{font-family:'IBM Plex Mono',monospace;fill:#8b98a5;font-size:11px}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="400" rx="14"/>
  <text class="t a" x="34" y="40" font-size="13" letter-spacing="2">// SERVER-SIDE TRACKING</text>

  <!-- Browser -->
  <rect class="box" x="40" y="176" width="170" height="88" rx="10"/>
  <text class="t" x="125" y="214" font-size="16" text-anchor="middle" font-weight="600">Browser</text>
  <text class="t m" x="125" y="236" font-size="11.5" text-anchor="middle">Meta pixel + GA4 tag</text>

  <!-- Server -->
  <rect class="boxc" x="345" y="140" width="200" height="150" rx="12"/>
  <text class="t" x="445" y="182" font-size="16" text-anchor="middle" font-weight="600">First-party server</text>
  <text class="t a" x="445" y="205" font-size="13" text-anchor="middle">Stape &#183; sGTM</text>
  <text class="t m" x="445" y="236" font-size="11.5" text-anchor="middle">server-managed</text>
  <text class="t m" x="445" y="252" font-size="11.5" text-anchor="middle">cookies</text>

  <!-- GA4 -->
  <rect class="box" x="665" y="100" width="160" height="76" rx="10"/>
  <text class="t" x="745" y="133" font-size="16" text-anchor="middle" font-weight="600">GA4</text>
  <text class="t m" x="745" y="155" font-size="11.5" text-anchor="middle">Analytics 4</text>

  <!-- Meta -->
  <rect class="box" x="665" y="248" width="160" height="76" rx="10"/>
  <text class="t" x="745" y="281" font-size="16" text-anchor="middle" font-weight="600">Meta</text>
  <text class="t m" x="745" y="303" font-size="11.5" text-anchor="middle">Conversions API</text>

  <!-- arrows (drawn first) -->
  <path class="ln" d="M210 220 L338 220" marker-end="url(#ar)"/>
  <path class="ln" d="M545 184 L661 140" marker-end="url(#ar)"/>
  <path class="ln" d="M545 248 L661 286" marker-end="url(#ar)"/>

  <!-- labels on chips (drawn on top so they never sit on a line) -->
  <rect class="chip" x="244" y="210" width="62" height="20" rx="5"/>
  <text class="lbl" x="275" y="224" text-anchor="middle">GTM web</text>
  <rect class="chip" x="560" y="147" width="80" height="20" rx="5"/>
  <text class="lbl" x="600" y="161" text-anchor="middle">/g/collect</text>
  <rect class="chip" x="548" y="258" width="106" height="20" rx="5"/>
  <text class="lbl" x="601" y="272" text-anchor="middle">server events</text>

  <!-- dedup badge -->
  <rect x="230" y="352" width="400" height="32" rx="16" fill="#0f2130" stroke="#2a6f96" stroke-width="1.2"/>
  <text class="t g" x="430" y="373" font-size="12.5" text-anchor="middle">shared event_id &#8594; browser + server deduplication</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Server-side tracking data flow: browser to a first-party Stape server container, forwarding to GA4 and Meta with shared event_id deduplication.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5cc8ff"/>
    </marker>
    <style>
      .bg{fill:#0b1017}
      .box{fill:#121a23;stroke:#2d3f4f;stroke-width:1.5}
      .boxc{fill:#0f2130;stroke:#2a6f96;stroke-width:2}
      .t{font-family:'IBM Plex Mono',monospace;fill:#e6edf3}
      .a{fill:#5cc8ff}.g{fill:#7ee787}.m{fill:#8b98a5}
      .lbl{font-family:'IBM Plex Mono',monospace;fill:#8b98a5;font-size:12px}
      .ln{stroke:#5cc8ff;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="400" rx="14"/>
  <text class="t a" x="34" y="42" font-size="13" letter-spacing="2">// SERVER-SIDE TRACKING</text>

  <!-- Browser -->
  <rect class="box" x="34" y="165" width="176" height="92" rx="10"/>
  <text class="t" x="122" y="205" font-size="16" text-anchor="middle" font-weight="600">Browser</text>
  <text class="t m" x="122" y="228" font-size="12" text-anchor="middle">Meta pixel + GA4 tag</text>

  <!-- Server (first-party) -->
  <rect class="boxc" x="345" y="130" width="200" height="160" rx="12"/>
  <text class="t" x="445" y="172" font-size="16" text-anchor="middle" font-weight="600">First-party server</text>
  <text class="t a" x="445" y="196" font-size="13" text-anchor="middle">Stape &middot; sGTM</text>
  <text class="t m" x="445" y="228" font-size="12" text-anchor="middle">server-managed</text>
  <text class="t m" x="445" y="245" font-size="12" text-anchor="middle">cookies</text>

  <!-- GA4 -->
  <rect class="box" x="670" y="96" width="156" height="80" rx="10"/>
  <text class="t" x="748" y="132" font-size="16" text-anchor="middle" font-weight="600">GA4</text>
  <text class="t m" x="748" y="154" font-size="12" text-anchor="middle">Analytics 4</text>

  <!-- Meta -->
  <rect class="box" x="670" y="244" width="156" height="80" rx="10"/>
  <text class="t" x="748" y="280" font-size="16" text-anchor="middle" font-weight="600">Meta</text>
  <text class="t m" x="748" y="302" font-size="12" text-anchor="middle">Conversions API</text>

  <!-- arrows -->
  <path class="ln" d="M210 211 L338 211" marker-end="url(#ar)"/>
  <text class="lbl" x="274" y="200" text-anchor="middle">GTM web</text>
  <path class="ln" d="M545 185 C610 160, 620 140, 663 136" marker-end="url(#ar)"/>
  <text class="lbl" x="600" y="150" text-anchor="middle">/g/collect</text>
  <path class="ln" d="M545 235 C610 260, 620 280, 663 284" marker-end="url(#ar)"/>
  <text class="lbl" x="600" y="300" text-anchor="middle">server events</text>

  <!-- dedup badge -->
  <rect x="230" y="345" width="400" height="34" rx="17" fill="#0f2130" stroke="#2a6f96" stroke-width="1.2"/>
  <text class="t g" x="430" y="367" font-size="12.5" text-anchor="middle">shared event_id  &#8594;  browser + server deduplication</text>
</svg>

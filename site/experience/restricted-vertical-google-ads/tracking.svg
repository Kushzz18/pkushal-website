<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Conversion tracking data flow from the store data layer through Google Tag Manager into Google Ads and GA4.">
  <defs>
    <marker id="tn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b98a5"/></marker>
    <style>
      .t{font-family:'IBM Plex Sans',sans-serif}.mo{font-family:'IBM Plex Mono',monospace}
      .ttl{fill:#e6edf3;font-weight:700}.sub{fill:#8b98a5}.m{fill:#8b98a5}
      .a{fill:#9bd8ff}.g{fill:#7ee787}.v{fill:#c6a8ff}
    </style>
  </defs>
  <rect width="960" height="470" rx="14" fill="#0b1017"/>
  <text class="t ttl" x="30" y="42" font-size="20">Conversion tracking data flow</text>
  <text class="t sub" x="30" y="66" font-size="13">Purchase value, currency and transaction ID carried from the store to value-based bidding</text>

  <rect x="30" y="100" width="200" height="120" rx="12" fill="#121a23" stroke="#2d3f4f"/>
  <text class="t" x="130" y="128" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">WooCommerce store</text>
  <text class="t m" x="130" y="152" font-size="12" text-anchor="middle">purchase completes</text>
  <rect x="48" y="166" width="164" height="42" rx="8" fill="#0f2130" stroke="#2a6f96"/>
  <text class="t a" x="130" y="184" font-size="11.5" text-anchor="middle">GTM4WP plugin pushes</text>
  <text class="t a" x="130" y="200" font-size="11.5" text-anchor="middle">the ecommerce dataLayer</text>

  <line x1="230" y1="160" x2="288" y2="160" stroke="#8b98a5" stroke-width="2.5" marker-end="url(#tn)"/>
  <rect x="292" y="112" width="176" height="96" rx="10" fill="#0f1620" stroke="#2d3f4f"/>
  <text class="t" x="380" y="136" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="middle">dataLayer payload</text>
  <text class="mo g" x="306" y="158" font-size="11.5">value</text>
  <text class="mo g" x="306" y="176" font-size="11.5">currency</text>
  <text class="mo g" x="306" y="194" font-size="11.5">transaction_id, items</text>

  <line x1="380" y1="208" x2="380" y2="238" stroke="#8b98a5" stroke-width="2.5" marker-end="url(#tn)"/>
  <rect x="250" y="242" width="260" height="128" rx="12" fill="#0f2130" stroke="#2a6f96"/>
  <text class="t" x="380" y="268" font-size="13" font-weight="700" fill="#9bd8ff" text-anchor="middle">Google Tag Manager</text>
  <rect x="268" y="280" width="224" height="30" rx="7" fill="#0b1620" stroke="#274a63"/>
  <text class="t a" x="380" y="300" font-size="11.5" text-anchor="middle">Data Layer Variables map each field</text>
  <rect x="268" y="316" width="224" height="30" rx="7" fill="#0b1620" stroke="#274a63"/>
  <text class="t a" x="380" y="336" font-size="11.5" text-anchor="middle">Purchase trigger on the dataLayer event</text>
  <text class="t" x="380" y="362" font-size="11" fill="#5cc8ff" text-anchor="middle">enhanced conversions + transaction_id dedup</text>

  <line x1="510" y1="286" x2="598" y2="286" stroke="#8b98a5" stroke-width="2.5" marker-end="url(#tn)"/>
  <rect x="602" y="242" width="330" height="60" rx="12" fill="#10241a" stroke="#2f7d52"/>
  <text class="t g" x="620" y="268" font-size="13" font-weight="700">Google Ads conversion tag</text>
  <text class="t" x="620" y="288" font-size="11.5" fill="#8fcaa6">PRIMARY source &#183; feeds value-based bidding</text>

  <rect x="602" y="312" width="330" height="58" rx="12" fill="#1a1430" stroke="#5b4a9e"/>
  <text class="t v" x="620" y="337" font-size="13" font-weight="700">GA4 purchase (imported)</text>
  <text class="t" x="620" y="356" font-size="11.5" fill="#a99bd8">SECONDARY source &#183; analytics + cross-check</text>

  <rect x="30" y="398" width="902" height="48" rx="10" fill="#241d10" stroke="#7a6320"/>
  <text class="t" x="46" y="420" font-size="12.5" font-weight="700" fill="#e6c463">Hurdle solved:</text>
  <text class="t" x="150" y="420" font-size="12.5" fill="#cdb46a">purchase fired with a $0 value, "(not set)" transaction ID and 0 items, the store was pushing an empty</text>
  <text class="t" x="150" y="438" font-size="12.5" fill="#cdb46a">ecommerce object. Enabling the data-layer feed and mapping the variables restored real value, currency and dedup.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-label="Product feed re-architecture, from an uncontrollable plugin XML feed to a self-owned Google Sheet feed as the single source for Merchant Center.">
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0662f"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7ee787"/></marker>
    <marker id="fn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b98a5"/></marker>
    <style>
      .t{font-family:'IBM Plex Sans',sans-serif}.mo{font-family:'IBM Plex Mono',monospace}
      .ttl{fill:#e6edf3;font-weight:700}.sub{fill:#8b98a5}
      .w{fill:#f0662f}.g{fill:#7ee787}.a{fill:#9bd8ff}.m{fill:#8b98a5}.ink{fill:#d7dee8}
    </style>
  </defs>
  <rect width="920" height="430" rx="14" fill="#0b1017"/>
  <text class="t ttl" x="30" y="42" font-size="20">Product feed re-architecture</text>
  <text class="t sub" x="30" y="66" font-size="13">From an uncontrollable plugin XML feed to a self-owned sheet as the single source of truth</text>

  <text class="mo w" x="30" y="108" font-size="13" font-weight="700">BEFORE</text>
  <rect x="30" y="120" width="200" height="70" rx="10" fill="#1e1310" stroke="#7a3a24"/>
  <text class="t w" x="130" y="150" font-size="13" font-weight="600" text-anchor="middle">Store plugin</text>
  <text class="t" x="130" y="170" font-size="12" fill="#c98a6f" text-anchor="middle">auto-generated XML</text>

  <line x1="130" y1="190" x2="130" y2="203" stroke="#f0662f" stroke-width="2" marker-end="url(#fw)"/>
  <rect x="30" y="205" width="200" height="66" rx="10" fill="#1e1310" stroke="#7a3a24"/>
  <text class="t" x="130" y="232" font-size="12.5" fill="#c98a6f" text-anchor="middle">Re-submits every SKU</text>
  <text class="t" x="130" y="252" font-size="12.5" fill="#c98a6f" text-anchor="middle">incl. non-compliant ones</text>

  <line x1="130" y1="271" x2="130" y2="284" stroke="#f0662f" stroke-width="2" marker-end="url(#fw)"/>
  <rect x="30" y="286" width="200" height="60" rx="10" fill="#241012" stroke="#f0662f"/>
  <text class="t w" x="130" y="313" font-size="12.5" font-weight="600" text-anchor="middle">Merchant Center</text>
  <text class="t" x="130" y="332" font-size="12" fill="#c98a6f" text-anchor="middle">archiving ignored</text>

  <line x1="250" y1="235" x2="328" y2="235" stroke="#8b98a5" stroke-width="2" marker-end="url(#fn)"/>
  <text class="mo m" x="289" y="225" font-size="12" text-anchor="middle">rebuilt</text>

  <text class="mo g" x="360" y="108" font-size="13" font-weight="700">AFTER</text>
  <rect x="360" y="120" width="230" height="76" rx="10" fill="#10241a" stroke="#2f7d52"/>
  <text class="t g" x="475" y="148" font-size="13" font-weight="600" text-anchor="middle">Self-owned Google Sheet</text>
  <text class="t" x="475" y="168" font-size="12" fill="#8fcaa6" text-anchor="middle">full Merchant Center schema</text>
  <text class="t" x="475" y="184" font-size="12" fill="#8fcaa6" text-anchor="middle">manually curated rows</text>

  <line x1="475" y1="196" x2="475" y2="210" stroke="#7ee787" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="360" y="212" width="230" height="60" rx="10" fill="#0f2130" stroke="#2a6f96"/>
  <text class="t a" x="475" y="238" font-size="12.5" text-anchor="middle">Normalized prices, categories,</text>
  <text class="t a" x="475" y="256" font-size="12.5" text-anchor="middle">research-only descriptions</text>

  <line x1="475" y1="272" x2="475" y2="286" stroke="#7ee787" stroke-width="2" marker-end="url(#fg)"/>
  <rect x="360" y="288" width="230" height="60" rx="10" fill="#10241a" stroke="#2f7d52"/>
  <text class="t g" x="475" y="314" font-size="12.5" font-weight="600" text-anchor="middle">Merchant Center</text>
  <text class="t" x="475" y="333" font-size="12" fill="#8fcaa6" text-anchor="middle">single controlled source</text>

  <line x1="600" y1="318" x2="658" y2="318" stroke="#8b98a5" stroke-width="2" marker-end="url(#fn)"/>
  <rect x="662" y="120" width="228" height="228" rx="12" fill="#121a23" stroke="#2d3f4f"/>
  <text class="t" x="776" y="158" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Outcome</text>
  <text class="t ink" x="682" y="196" font-size="12.5"><tspan class="g">&#10003;</tspan> Only chosen SKUs submit</text>
  <text class="t ink" x="682" y="224" font-size="12.5"><tspan class="g">&#10003;</tspan> Auto source kept OFF</text>
  <text class="t ink" x="682" y="252" font-size="12.5"><tspan class="g">&#10003;</tspan> Edits without dev help</text>
  <text class="t ink" x="682" y="280" font-size="12.5"><tspan class="g">&#10003;</tspan> Full approval on the</text>
  <text class="t ink" x="700" y="298" font-size="12.5">submitted set</text>
  <text class="t ink" x="682" y="326" font-size="12.5"><tspan class="g">&#10003;</tspan> No non-compliant leaks</text>
</svg>

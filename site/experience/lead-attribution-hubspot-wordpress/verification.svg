<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace">
  <rect width="760" height="500" fill="#0a0f14"/>
  <text x="36" y="40" font-size="18" font-weight="600" fill="#e6edf3">End-to-end verification</text>
  <text x="36" y="60" font-size="12" fill="#8a97a4">A controlled, utm-tagged test submission, traced into the backend mail log.</text>

  <g transform="translate(36,84)">
    <rect width="688" height="296" rx="12" fill="#121a23" stroke="#22303d"/>
    <g font-size="13" fill="#e6edf3">
      <g transform="translate(24,36)">
        <text x="0" y="0">Form submission (REST endpoint)</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#13241c"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ee787">200 OK</text>
      </g>
      <g transform="translate(24,76)">
        <text x="0" y="0">Tracking cookie set in browser</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#13241c"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ee787">Yes</text>
      </g>
      <g transform="translate(24,116)">
        <text x="0" y="0">utm + click ID captured on submit</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#13241c"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ee787">Yes</text>
      </g>
      <g transform="translate(24,156)">
        <text x="0" y="0">CRM Forms API response</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#13241c"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ee787">200 accepted</text>
      </g>
      <g transform="translate(24,196)">
        <text x="0" y="0">Notification to enquiries inbox</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#13241c"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ee787">Sent</text>
      </g>
      <g transform="translate(24,236)">
        <text x="0" y="0">Customer confirmation email</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#13241c"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7ee787">Sent</text>
      </g>
      <g transform="translate(24,276)">
        <text x="0" y="0">Two third-party quote APIs (pre-existing)</text>
        <rect x="486" y="-16" width="156" height="24" rx="12" fill="#241c10"/>
        <text x="564" y="1" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f4a07a">Failing, flagged</text>
      </g>
    </g>
  </g>

  <g transform="translate(36,400)">
    <rect width="688" height="78" rx="10" fill="#0f2130" stroke="#2f6f96"/>
    <text x="20" y="28" font-size="12.5" font-weight="600" fill="#5cc8ff">Outcome</text>
    <text x="20" y="50" font-size="11.5" fill="#d7dee8">Paid-search leads now arrive in the CRM with their real source and campaign. The client team confirmed</text>
    <text x="20" y="66" font-size="11.5" fill="#d7dee8">lead source is reporting correctly. Two unrelated vendor integrations were surfaced as scoped follow-up.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="A client website contains a cross-origin Jobber booking form in an iframe. The submit event stays inside the iframe and never reaches the pixel or tag manager on the page.">
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0662f"/></marker>
    <style>
      .bg{fill:#0b1017}
      .t{font-family:'IBM Plex Sans',sans-serif;fill:#e6edf3}
      .mo{font-family:'IBM Plex Mono',monospace}
      .m{fill:#8b98a5}.w{fill:#f0662f}
      .field{fill:#17212c}
      .chip{fill:#0b1017}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="300" rx="14"/>
  <rect x="22" y="42" width="676" height="236" rx="12" fill="none" stroke="#33414f"/>
  <text class="t mo m" x="40" y="66" font-size="12">client website (your origin)</text>

  <!-- iframe -->
  <rect x="50" y="94" width="300" height="158" rx="10" fill="none" stroke="#f0662f" stroke-dasharray="5 4"/>
  <text class="mo w" x="200" y="118" text-anchor="middle" font-size="11">Jobber booking form &#183; other origin</text>
  <rect class="field" x="78" y="134" width="244" height="26" rx="5"/>
  <rect class="field" x="78" y="168" width="244" height="26" rx="5"/>
  <rect x="78" y="206" width="96" height="30" rx="6" fill="#f0662f"/>
  <text class="t" x="126" y="226" text-anchor="middle" font-size="12" fill="#fff">Submit</text>

  <!-- pixel / gtm -->
  <rect x="432" y="122" width="256" height="72" rx="10" fill="none" stroke="#2a6f96"/>
  <text class="t" x="560" y="152" text-anchor="middle" font-size="14">Pixel &#183; Tag Manager</text>
  <text class="t mo m" x="560" y="172" text-anchor="middle" font-size="11">listening for a submit</text>

  <!-- blocked path -->
  <line x1="354" y1="168" x2="424" y2="168" stroke="#f0662f" stroke-width="2" marker-end="url(#w)"/>
  <line x1="381" y1="156" x2="397" y2="180" stroke="#f0662f" stroke-width="2.5"/>
  <line x1="397" y1="156" x2="381" y2="180" stroke="#f0662f" stroke-width="2.5"/>
  <rect class="chip" x="345" y="196" width="90" height="20" rx="5"/>
  <text class="mo w" x="390" y="210" text-anchor="middle" font-size="11">event blocked</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="The same recipe page shown two ways in Google: a plain text result without recipe schema, versus a richer result with a thumbnail, star rating and cook time when recipe schema is present.">
  <defs>
    <style>
      .t{font-family:'IBM Plex Sans',sans-serif}.mo{font-family:'IBM Plex Mono',monospace}
      .ttl{fill:#e6edf3;font-weight:700}.m{fill:#8b98a5}.a{fill:#5cc8ff}.g{fill:#7ee787}
      .blue{fill:#8ab4f8}.url{fill:#9fb2c0}.desc{fill:#c7d0d9}.star{fill:#e6c463}
    </style>
  </defs>
  <rect width="900" height="440" rx="14" fill="#0b1017"/>
  <text class="t ttl" x="30" y="42" font-size="20">The same page, two ways it can appear</text>
  <text class="t m" x="30" y="66" font-size="13">Same URL, same query, same rank. The markup changes how much of the result you own.</text>

  <!-- WITHOUT -->
  <rect x="30" y="92" width="390" height="300" rx="12" fill="#0f1620" stroke="#2d3f4f"/>
  <text class="mo m" x="50" y="122" font-size="12" letter-spacing="1">WITHOUT RECIPE SCHEMA</text>
  <rect x="50" y="140" width="16" height="16" rx="4" fill="#1c2733"/>
  <text class="t url" x="74" y="153" font-size="11.5">peteraugustus.example &#183; Cooking</text>
  <text class="t blue" x="50" y="182" font-size="16">Slow-cooked beef brisket, easy oven recipe</text>
  <text class="t desc" x="50" y="208" font-size="12.5">A step-by-step method for a pull-apart brisket in the</text>
  <text class="t desc" x="50" y="226" font-size="12.5">oven, with timing, temperatures and the cut to ask for.</text>
  <rect x="50" y="250" width="330" height="1" fill="#1c2733"/>
  <text class="t m" x="50" y="284" font-size="12">Plain blue link. Text only, no image, no rating,</text>
  <text class="t m" x="50" y="302" font-size="12">no cook time. One line in a list of ten.</text>
  <rect x="50" y="330" width="150" height="30" rx="7" fill="#141d27" stroke="#2d3f4f"/>
  <text class="mo m" x="125" y="350" font-size="12" text-anchor="middle">~1 result of visibility</text>

  <!-- WITH -->
  <rect x="480" y="92" width="390" height="300" rx="12" fill="#0f2130" stroke="#2a6f96"/>
  <text class="mo a" x="500" y="122" font-size="12" letter-spacing="1">WITH RECIPE SCHEMA</text>
  <rect x="500" y="140" width="120" height="120" rx="10" fill="#16222e" stroke="#2a6f96"/>
  <circle cx="560" cy="200" r="34" fill="none" stroke="#3d86b8" stroke-width="3"/>
  <circle cx="560" cy="200" r="12" fill="#2a6f96"/>
  <text class="mo a" x="560" y="246" font-size="9" text-anchor="middle" opacity=".8">recipe image</text>
  <text class="t blue" x="640" y="158" font-size="16">Slow-cooked beef brisket,</text>
  <text class="t blue" x="640" y="178" font-size="16">easy oven recipe</text>
  <text class="star" x="640" y="204" font-size="14">&#9733;&#9733;&#9733;&#9733;<tspan fill="#4a5560">&#9733;</tspan> <tspan class="url" font-size="12">4.7 (128)</tspan></text>
  <text class="t desc" x="640" y="228" font-size="12">&#183; 8 hr &#183; 520 cal &#183; serves 6</text>
  <rect x="640" y="242" width="70" height="20" rx="5" fill="#12331f" stroke="#2f7d52"/>
  <text class="mo g" x="675" y="256" font-size="10.5" text-anchor="middle">Recipe</text>
  <text class="t desc" x="500" y="298" font-size="12.5">Image, star rating, cook time and a Recipe badge,</text>
  <text class="t desc" x="500" y="316" font-size="12.5">and eligibility for the Recipe carousel at the top.</text>
  <rect x="500" y="330" width="200" height="30" rx="7" fill="#123246" stroke="#2a6f96"/>
  <text class="mo a" x="600" y="350" font-size="12" text-anchor="middle">3&#8211;4x the pixels, same rank</text>

  <text class="t m" x="450" y="418" font-size="12.5" text-anchor="middle">The schema does not move the ranking. It makes the page eligible for a result type that simply owns more of the screen.</text>
</svg>
